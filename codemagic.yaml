workflows:
  android-debug:
    name: Android Debug
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      flutter: stable
    scripts:
      - name: Générer le dossier android manquant
        script: |
          flutter create --platforms=android .
      - name: Désactiver newDsl (compatibilité anciens plugins)
        script: |
          echo "android.newDsl=false" >> android/gradle.properties
      - name: Récupérer les dépendances
        script: |
          flutter pub get
      - name: Build APK debug
        script: |
          flutter build apk --debug
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
